[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpidx"
version = "0.1.0"
description = "Tooling for a tag-indexed competitive programming problem catalogue"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "black>=24.0"]

[project.scripts]
cpidx = "cpidx.cli:main"

[tool.setuptools.packages.find]
include = ["cpidx*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
