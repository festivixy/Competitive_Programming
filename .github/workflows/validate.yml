name: validate

on:
  push:
    paths:
      - "problems.csv"
      - "taxonomy.yaml"
      - "tools/**"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cpidx
        run: python -m pip install --quiet -e "tools[dev]"

      # SPEC.md 9: an invalid index must block the push.
      - name: Validate the index
        run: cpidx validate

      # SPEC.md 5.5: the canonical sort is what keeps branch merges line-wise.
      - name: Check canonical formatting
        run: cpidx fmt --check

      - name: Lint
        run: |
          python -m ruff check tools/cpidx tools/tests
          python -m black --check tools/cpidx tools/tests

      - name: Test
        run: python -m pytest tools/tests -q --cov=cpidx --cov-fail-under=80

      # linkcheck reaches the network, so CI only checks the `verified` dates.
      # Run `cpidx linkcheck` locally for the live probe.
      - name: Report stale verification dates
        run: cpidx linkcheck --offline
